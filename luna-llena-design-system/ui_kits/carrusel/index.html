<!-- @dsCard group="Carrusel" viewport="1080x1350" name="Carrusel · 1080×1350" subtitle="Set de 8 slides: hook, contenido numerado y CTA — deslizable" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../../components/bundle.css">
<style>
  html, body { margin: 0; height: 100%; background: #161616; font-family: var(--font-sans); }
  #app { position: fixed; inset: 0; display: grid; place-items: center; }
  .stage { position: relative; }
  .canvas-wrap { box-shadow: 0 30px 80px rgba(0,0,0,0.5); border-radius: 4px; overflow: hidden; }
  .nav { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 16px; z-index: 10; }
  .nav button { width: 48px; height: 48px; border-radius: 999px; border: none; background: var(--primary); color: var(--text); font-size: 22px; font-weight: 800; cursor: pointer; font-family: var(--font-sans); }
  .nav button:disabled { opacity: 0.3; cursor: default; }
  .nav .count { color: rgba(255,255,255,0.7); font-weight: 600; font-size: 14px; letter-spacing: 0.08em; min-width: 64px; text-align: center; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../components/bundle.js"></script>
<script type="text/babel" src="./CarruselSlides.jsx"></script>
</head>
<body>
  <div id="app"></div>
  <script type="text/babel">
    const PHOTO = '../../assets/placeholder.jpg';
    const TOTAL = 4;
    const slides = [
      <HookSlide src={PHOTO} kicker="Argentina sin errores"
        hook="Los 8 lugares que no podés saltearte en tu primer viaje" highlight="no"
        current={1} total={TOTAL} />,
      <ListSlide n={1} kicker="Patagonia" titular="El Perito Moreno en invierno"
        bajada="Menos gente, mejores precios y el glaciar crujiendo en silencio. Andá entre junio y agosto, llevá capas y zapatos con buen agarre."
        current={2} total={TOTAL} />,
      <ListSlide n={2} kicker="Norte" titular="Purmamarca al amanecer"
        bajada="El Cerro de los Siete Colores se prende temprano. Salí antes de las 8 y evitás los micros de turistas."
        current={3} total={TOTAL} />,
      <CTASlide titular="Guardá esta guía para tu próximo viaje" keyword="VIAJE" current={4} total={TOTAL} />,
    ];

    function App() {
      const [i, setI] = React.useState(0);
      const [scale, setScale] = React.useState(1);
      React.useEffect(() => {
        const fit = () => {
          const pad = 120;
          const s = Math.min((window.innerWidth - pad) / CARRUSEL_W, (window.innerHeight - pad) / CARRUSEL_H);
          setScale(Math.min(s, 1));
        };
        fit(); window.addEventListener('resize', fit);
        return () => window.removeEventListener('resize', fit);
      }, []);
      React.useEffect(() => {
        const k = (e) => { if (e.key === 'ArrowRight') setI(v => Math.min(v + 1, slides.length - 1)); if (e.key === 'ArrowLeft') setI(v => Math.max(v - 1, 0)); };
        window.addEventListener('keydown', k); return () => window.removeEventListener('keydown', k);
      }, []);
      return (
        <div className="stage">
          <div className="canvas-wrap" style={{ width: CARRUSEL_W * scale, height: CARRUSEL_H * scale }}>
            <div style={{ width: CARRUSEL_W, height: CARRUSEL_H, transform: `scale(${scale})`, transformOrigin: 'top left' }}>
              {slides[i]}
            </div>
          </div>
          <div className="nav">
            <button onClick={() => setI(v => Math.max(v - 1, 0))} disabled={i === 0}>‹</button>
            <span className="count">{i + 1} / {slides.length}</span>
            <button onClick={() => setI(v => Math.min(v + 1, slides.length - 1))} disabled={i === slides.length - 1}>›</button>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('app')).render(<App />);
  </script>
</body>
</html>
