<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Carrusel · Ficha sobre foto" description="Slide de contenido 1080×1350: foto full-bleed sin banda ni gradiente, bloque de texto blanco centrado con ancla vertical variable, jerarquía plana y énfasis por peso" -->
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="./ds-base.js"></script>
  <style>
    body { margin:0; background:#161616; display:grid; place-items:center; min-height:100vh; }
  </style>
</helmet>

<div style="position:relative; width:1080px; height:1350px; overflow:hidden; background:#161616; font-family:'Inter',sans-serif; box-shadow:0 30px 80px rgba(0,0,0,0.5);">

  <div ref="{{ fotoRef }}" style="position:absolute; inset:0; background-image:url('../../assets/placeholder.jpg'); background-size:cover; background-position:center; filter:saturate(1) brightness(1);"></div>

  <div ref="{{ blockRef }}" style="position:absolute; inset:0; display:flex; flex-direction:column; justify-content:flex-end; padding:150px 90px;">
    <div ref="{{ fraseRef }}" style="display:none; flex-direction:column; gap:30px; align-items:flex-start; text-align:left; max-width:880px; color:#FFFFFF; text-shadow:0 2px 20px rgba(22,22,22,0.55);">
      <p style="margin:0; text-align:left; font-weight:400; font-size:58px; letter-spacing:-0.025em; line-height:1.16;">Porque vas a caminar <span style="font-weight:800;">sobre el Perito Moreno</span> con crampones.</p>
      <p ref="{{ bajadaRef }}" style="margin:0; text-align:left; font-weight:400; font-size:38px; letter-spacing:-0.015em; line-height:1.3;">250 km² de hielo en movimiento, y el único glaciar del mundo que se pisa sin ser andinista.</p>
    </div>
    <div ref="{{ planaRef }}" style="display:flex; flex-direction:column; gap:8px; align-items:center; text-align:center; color:#FFFFFF; text-shadow:0 2px 20px rgba(22,22,22,0.55); text-wrap:balance;">
      <p style="margin:0; text-align:center; font-weight:700; font-size:46px; letter-spacing:-0.02em; line-height:1.22;">Perito Moreno</p>
      <p style="margin:0; text-align:center; font-weight:400; font-size:46px; letter-spacing:-0.01em; line-height:1.22;">Ver el glaciar desde la pasarela no alcanza.<br><span style="font-weight:700;">Caminalo con crampones</span> sobre 250 km²<br>de hielo en movimiento</p>
    </div>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:64px; display:flex; justify-content:center; opacity:0.92;">
    <x-import component-from-global-scope="VisiteArPeru.LogoMark" variant="white" size="{{ logoSize }}" hint-size="130px,30px"></x-import>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;composicion&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;plana&quot;,&quot;frase&quot;],&quot;default&quot;:&quot;plana&quot;,&quot;tsType&quot;:&quot;'plana'|'frase'&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;bajada&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Texto&quot;},&quot;ancla&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;arriba&quot;,&quot;medio&quot;,&quot;abajo&quot;],&quot;default&quot;:&quot;abajo&quot;,&quot;tsType&quot;:&quot;'arriba'|'medio'|'abajo'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;filtroMarca&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Foto&quot;}}">
class Component extends DCLogic {
  fotoRef = React.createRef();
  blockRef = React.createRef();
  planaRef = React.createRef();
  fraseRef = React.createRef();
  bajadaRef = React.createRef();
  apply() {
    const ancla = this.props.ancla ?? 'abajo';
    // 'plana': nombre + copy al mismo cuerpo, centrado (composicion original).
    // 'frase': una sola oracion corrida, alineada a la izquierda, con el enfasis en 800
    // atravesando el corte de linea. Mas dinamica: el bloque queda irregular a proposito.
    const frase = (this.props.composicion ?? 'plana') === 'frase';
    if (this.blockRef.current) {
      this.blockRef.current.style.justifyContent = ancla === 'arriba' ? 'flex-start' : ancla === 'abajo' ? 'flex-end' : 'center';
      this.blockRef.current.style.alignItems = frase ? 'flex-start' : 'stretch';
    }
    if (this.planaRef.current) this.planaRef.current.style.display = frase ? 'none' : 'flex';
    if (this.fraseRef.current) this.fraseRef.current.style.display = frase ? 'flex' : 'none';
    if (this.bajadaRef.current) this.bajadaRef.current.style.display = (this.props.bajada ?? true) ? 'block' : 'none';
    if (this.fotoRef.current) this.fotoRef.current.style.filter = (this.props.filtroMarca ?? false) ? 'saturate(0.82) brightness(0.93)' : 'saturate(1) brightness(1)';
  }
  componentDidMount() { this.apply(); }
  componentDidUpdate() { this.apply(); }
  renderVals() {
    return { fotoRef: this.fotoRef, blockRef: this.blockRef, planaRef: this.planaRef, fraseRef: this.fraseRef, bajadaRef: this.bajadaRef, logoSize: 26 };
  }
}

</script>
</body>
</html>
