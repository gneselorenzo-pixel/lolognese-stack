<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Carrusel · Rótulo y dato" description="Slide de serie 1080×1350: foto full-bleed a saturación plena, scrim corto al pie, rótulo de una palabra con un renglón de datos debajo y el wordmark centrado. Formato de taxonomía: 6–8 slides idénticas más portada y CTA" -->
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="./ds-base.js"></script>
  <style>
    body { margin:0; background:#161616; display:grid; place-items:center; min-height:100vh; }
  </style>
</helmet>

<div style="position:relative; width:1080px; height:1350px; overflow:hidden; background:#161616; font-family:'Inter',sans-serif; box-shadow:0 30px 80px rgba(0,0,0,0.5);">

  <div ref="{{ fotoRef }}" style="position:absolute; inset:0; background-image:url('../../assets/placeholder.jpg'); background-size:cover; background-position:center; filter:saturate(1) brightness(1);"></div>

  <div style="position:absolute; inset:0; background:linear-gradient(to top, rgba(22,22,22,0.82) 0%, rgba(22,22,22,0.45) 14%, rgba(22,22,22,0) 30%);"></div>

  <div style="position:absolute; left:90px; right:90px; bottom:56px; display:flex; flex-direction:column; align-items:center; gap:10px; text-align:center; color:#FFFFFF; text-wrap:balance;">
    <p ref="{{ rotuloRef }}" style="margin:0; text-align:center; color:#FF7A00; font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:800; font-size:58px; letter-spacing:-0.02em; line-height:1.06;">Glaciares</p>
    <p ref="{{ datoRef }}" style="margin:0; text-align:center; font-weight:400; font-size:36px; letter-spacing:-0.01em; line-height:1.3;">48 glaciares en un parque. Uno todavía crece.</p>
    <div style="margin-top:26px; opacity:0.92;">
      <x-import component-from-global-scope="VisiteArPeru.LogoMark" variant="white" size="{{ logoSize }}" hint-size="130px,30px"></x-import>
    </div>
  </div>

</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;variante&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;contenido&quot;,&quot;portada&quot;],&quot;default&quot;:&quot;contenido&quot;,&quot;tsType&quot;:&quot;'contenido'|'portada'&quot;,&quot;section&quot;:&quot;Layout&quot;},&quot;filtroMarca&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Foto&quot;}}">
class Component extends DCLogic {
  fotoRef = React.createRef();
  rotuloRef = React.createRef();
  datoRef = React.createRef();

  apply() {
    const portada = (this.props.variante ?? 'contenido') === 'portada';
    const foto = this.fotoRef.current;
    const rot = this.rotuloRef.current;
    const dato = this.datoRef.current;

    if (foto) foto.style.filter = (this.props.filtroMarca ?? false) ? 'saturate(0.82) brightness(0.93)' : 'saturate(1) brightness(1)';

    // La portada es el mismo bloque: el rótulo crece un paso y el dato pasa a
    // mayúsculas con tracking abierto (el rol de kicker), que es como la
    // referencia diferencia la tapa sin cambiar de layout.
    if (rot) rot.style.fontSize = portada ? '72px' : '58px';
    if (dato) {
      dato.style.textTransform = portada ? 'uppercase' : 'none';
      dato.style.letterSpacing = portada ? '0.14em' : '-0.01em';
      dato.style.fontWeight = portada ? '600' : '400';
      dato.style.fontSize = portada ? '30px' : '36px';
    }
  }

  componentDidMount() { this.apply(); }
  componentDidUpdate() { this.apply(); }

  renderVals() {
    return { fotoRef: this.fotoRef, rotuloRef: this.rotuloRef, datoRef: this.datoRef, logoSize: 26 };
  }
}

</script>
</body>
</html>
