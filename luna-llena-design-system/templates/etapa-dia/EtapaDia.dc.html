<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<!-- @template name="Carrusel · Etapa por día" description="Slide de itinerario 1080×1350: foto full-bleed a saturación plena, scrim a la cabeza, bloque anclado arriba a la izquierda con barra naranja — kicker de día, titular y bajada de un renglón — y el wordmark centrado al pie. Formato secuencial: una slide por día o tramo" -->
<helmet>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <script src="./ds-base.js"></script>
  <style>
    body { margin:0; background:#161616; display:grid; place-items:center; min-height:100vh; }
  </style>
</helmet>

<div style="position:relative; width:1080px; height:1350px; overflow:hidden; background:#161616; font-family:'Inter',sans-serif; box-shadow:0 30px 80px rgba(0,0,0,0.5);">

  <div ref="{{ fotoRef }}" style="position:absolute; inset:0; background-image:url('../../assets/placeholder.jpg'); background-size:cover; background-position:center; filter:saturate(1) brightness(1);"></div>

  <div ref="{{ scrimRef }}" style="position:absolute; inset:0; background:linear-gradient(to bottom, rgba(22,22,22,0.78) 0%, rgba(22,22,22,0.42) 14%, rgba(22,22,22,0) 32%);"></div>

  <div style="position:absolute; left:90px; right:120px; top:150px; border-left:5px solid #FF7A00; padding-left:34px; text-align:left; color:#FFFFFF; text-wrap:pretty; text-shadow:0 2px 20px rgba(22,22,22,0.55);">
    <p ref="{{ kickerRef }}" style="margin:0 0 14px; text-align:left; color:#FF7A00; font-weight:600; font-size:26px; letter-spacing:0.14em; line-height:1; text-transform:uppercase;">DÍA 9</p>
    <p ref="{{ tituloRef }}" style="margin:0 0 20px; text-align:left; font-family:'Bricolage Grotesque',system-ui,sans-serif; font-weight:800; font-size:62px; letter-spacing:-0.02em; line-height:1.06;">Machu Picchu, al fin</p>
    <p ref="{{ bajadaRef }}" style="margin:0; text-align:left; font-weight:400; font-size:36px; letter-spacing:-0.01em; line-height:1.3;">Parate frente a una de las siete maravillas, envuelta en niebla de la mañana.</p>
  </div>

  <div style="position:absolute; left:0; right:0; bottom:56px; display:flex; justify-content:center; opacity:0.92;">
    <x-import component-from-global-scope="VisiteArPeru.LogoMark" variant="white" size="{{ logoSize }}" hint-size="130px,30px"></x-import>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1080,&quot;height&quot;:1350},&quot;scrimCabeza&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Foto&quot;},&quot;filtroMarca&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Foto&quot;},&quot;kickerMonocromo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Color&quot;},&quot;escala&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;dia&quot;,&quot;tramo&quot;],&quot;default&quot;:&quot;dia&quot;,&quot;tsType&quot;:&quot;'dia'|'tramo'&quot;,&quot;section&quot;:&quot;Layout&quot;}}">
class Component extends DCLogic {
  fotoRef = React.createRef();
  scrimRef = React.createRef();
  kickerRef = React.createRef();
  tituloRef = React.createRef();
  bajadaRef = React.createRef();

  apply() {
    const foto = this.fotoRef.current;
    const scrim = this.scrimRef.current;
    const kicker = this.kickerRef.current;
    const titulo = this.tituloRef.current;
    const bajada = this.bajadaRef.current;

    // Filtro de marca apagado por default: la referencia vive del color de la foto.
    // Prendelo cuando el set mezcla temperaturas muy distintas (precedente: ficha-sobre-foto).
    if (foto) foto.style.filter = (this.props.filtroMarca ?? false) ? 'saturate(0.82) brightness(0.93)' : 'saturate(1) brightness(1)';

    // El scrim a la cabeza es el mecanismo de legibilidad del estilo. Se apaga SOLO
    // cuando la foto ya llega oscura arriba; la sombra de texto queda siempre.
    if (scrim) scrim.style.opacity = (this.props.scrimCabeza ?? true) ? '1' : '0';

    // Kicker en blanco: recupera el monocromo absoluto de la referencia a costa de
    // dejar el naranja solo en la barra y en el .ar del wordmark.
    const mono = (this.props.kickerMonocromo ?? false);
    if (kicker) kicker.style.color = mono ? '#FFFFFF' : '#FF7A00';

    // Tramo de varios días: el titular baja un paso porque el kicker crece de ancho
    // y el bloque no puede pasar de tres renglones contando la bajada.
    const tramo = (this.props.escala ?? 'dia') === 'tramo';
    if (titulo) titulo.style.fontSize = tramo ? '56px' : '62px';
    if (bajada) bajada.style.fontSize = tramo ? '34px' : '36px';
  }

  componentDidMount() { this.apply(); }
  componentDidUpdate() { this.apply(); }

  renderVals() {
    return {
      fotoRef: this.fotoRef,
      scrimRef: this.scrimRef,
      kickerRef: this.kickerRef,
      tituloRef: this.tituloRef,
      bajadaRef: this.bajadaRef,
      logoSize: 26
    };
  }
}
</script>
</body>
</html>
