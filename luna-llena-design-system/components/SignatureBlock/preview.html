<!-- @dsCard group="Contenido" height=480 subtitle="Bloque de texto de marca, liso o con barra naranja opcional" -->
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Inter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
  body { margin: 0; font-family: var(--font-sans); background: var(--surface-dark); }
  #root { padding: 36px 40px; display: flex; flex-direction: column; gap: 36px; }
  .gap { height: 0; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  const h = React.createElement;
  const { SignatureBlock } = window.VisiteArPeru;
  const SB = window.VisiteArPeru;
  const block = (bar) => h(SignatureBlock, { bar },
    h(SB.Kicker, { style: { marginBottom: 18 } }, 'Argentina sin errores'),
    h(SB.Hook, { size: '48px', highlight: 'no', style: { marginBottom: 16 } }, 'Los 8 lugares que no podés saltearte'),
    h(SB.Bajada, { size: '22px', style: { maxWidth: 540 } }, 'Una ruta honesta para tu primer viaje.'));
  ReactDOM.createRoot(document.getElementById('root')).render(h(React.Fragment, null, block(false), block(true)));
</script>
</body>
</html>
