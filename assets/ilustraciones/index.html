<title>Chacana: ilustraciones del carrusel</title>
<style>
  :root { --w: 240px; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px; background: #eee; color: #161616; font: 14px/1.4 Inter, system-ui, sans-serif; }
  h1 { font: 600 22px/1.2 Fraunces, Georgia, serif; margin: 0 0 12px; }
  .bar { display: flex; gap: 16px; align-items: center; margin-bottom: 20px; }
  .bar label { cursor: pointer; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(calc(var(--w) * 2 + 40px), 1fr)); gap: 20px; }
  figure { margin: 0; }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .p { padding: 12px; display: flex; align-items: center; justify-content: center; min-height: calc(var(--w) * 0.6); }
  .p .ill { width: var(--w); height: auto; display: block; max-width: 100%; }
  .dark { background: #161616; color: #fff; --accent: #FF7A00; }
  .light { background: #fff; color: #161616; --accent: #E56D00; }
  figcaption { margin-top: 6px; font-size: 13px; }
</style>
</head>
